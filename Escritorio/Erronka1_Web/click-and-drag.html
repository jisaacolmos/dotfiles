<!DOCTYPE HTML>
<html>

<head>
    <title>Bounded Click and Drag Background</title>
</head>

<body>
    <style>
        #pan-container {
            width: 100%;
            height: 500px;
            border: 2px solid #ccc;
            cursor: grab;
            background-image: url('https://cdn.britannica.com/92/212692-050-D53981F5/labradoodle-dog-stick-running-grass.jpg');
            background-repeat: no-repeat;
            background-position: 0px 0px;
            background-size: cover;
        }

        #pan-container:active {
            cursor: grabbing;
        }
    </style>

    <div id="pan-container"></div>

    <script>
        const container = document.getElementById('pan-container');

        let isDragging = false;
        let startX, startY;
        let startBgX = 0, startBgY = 0;

        let minX = 0, minY = 0;

        function updateBoundaries() {
            const img = new Image();
            const bgImgUrl = window.getComputedStyle(container).backgroundImage.slice(5, -2);
            img.src = bgImgUrl;

            img.onload = function () {
                const containerWidth = container.clientWidth;
                const containerHeight = container.clientHeight;

                const containerRatio = containerWidth / containerHeight;
                const imageRatio = img.width / img.height;

                let renderedWidth, renderedHeight;

                if (containerRatio > imageRatio) {
                    renderedWidth = containerWidth;
                    renderedHeight = containerWidth / imageRatio;
                } else {
                    renderedWidth = containerHeight * imageRatio;
                    renderedHeight = containerHeight;
                }

                minX = containerWidth - renderedWidth;
                minY = containerHeight - renderedHeight;
            };
        }

        window.addEventListener('load', updateBoundaries);
        window.addEventListener('resize', updateBoundaries);

        container.addEventListener('mousedown', (e) => {
            isDragging = true;

            startX = e.clientX;
            startY = e.clientY;

            const computedStyle = window.getComputedStyle(container);
            const bgPos = computedStyle.backgroundPosition.split(' ');

            startBgX = parseInt(bgPos[0]) || 0;
            startBgY = parseInt(bgPos[1]) || 0;

            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;

            let targetX = startBgX + deltaX;
            let targetY = startBgY + deltaY;

            targetX = Math.max(minX, Math.min(0, targetX));
            targetY = Math.max(minY, Math.min(0, targetY));

            container.style.backgroundPosition = `${targetX}px ${targetY}px`;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });
    </script>
</body>

</html>
